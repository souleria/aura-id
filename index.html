<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aura ID v1.0 | Portable AI Identity, Preferences & Consent Layer</title>
<style>
:root{color-scheme:light;--canvas:#f5f4f0;--paper:#fffefa;--ink:#242621;--muted:#66685e;--line:#d6d6cd;--accent:#a83f23;--soft:#ecebe4;--green:#263e36}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:15px/1.55 Arial,Helvetica,sans-serif}
body[data-theme=dark]{color-scheme:dark;--canvas:#181c19;--paper:#222823;--ink:#f5f4ed;--muted:#b5baaf;--line:#444b42;--accent:#f1a17f;--soft:#2d342d}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;border:0;min-height:38px;border-radius:4px}
input,textarea,select{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:8px 10px;margin-top:4px}
.header,footer{max-width:1380px;margin:auto;padding:18px 4%;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
footer{border-bottom:0;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.wordmark{font:36px Georgia,serif;letter-spacing:-2px;text-decoration:none;color:inherit}.wordmark span{font:13px Arial,sans-serif;margin-left:5px}.dot{color:var(--accent)}
nav,.footer-links{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.text-btn{background:none;padding:5px 2px;font-size:13px;min-height:auto}.text-btn[aria-current=page]{font-weight:700;text-decoration:underline}
.primary{background:var(--ink);color:var(--canvas);padding:10px 16px;font-size:13px;font-weight:500}
.secondary{background:transparent;border:1px solid var(--line);padding:9px 14px;font-size:13px}
.wrap{max-width:1380px;margin:auto;padding:32px 4% 48px}
.hero,.grid-2{display:grid;grid-template-columns:1.1fr 1fr;gap:32px;align-items:start}
h1{font:clamp(32px,4vw,58px)/1.08 Georgia,serif;letter-spacing:-1.5px;margin:6px 0 14px;font-weight:400}h1 em{color:var(--accent)}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:24px}
.card,.box{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:18px}
.passport{color:#f2f0df;background:#233a32;aspect-ratio:1.58;max-width:480px;width:100%;border-radius:14px;padding:22px 24px;display:flex;flex-direction:column;justify-content:space-between}
.passport[data-surface=light]{background:#e9e6dc;color:#1f2420;border:1px solid #cbc7b9}
.mono{font:10px/1.4 'Courier New',monospace;text-transform:uppercase;letter-spacing:.7px}
.pill{display:inline-block;font:10px 'Courier New',monospace;padding:3px 7px;border-radius:3px;background:#ffffff1a;border:1px solid #ffffff30;margin:4px 4px 0 0}
.badge{display:inline-block;font:10px 'Courier New',monospace;padding:2px 6px;border-radius:3px;border:1px solid var(--line);text-transform:uppercase}
.badge[data-l=Public],.badge[data-l=active]{background:#263e36;color:#f2f0df}
.badge[data-l=Shareable]{color:var(--accent);border-color:var(--accent)}
.badge[data-l=Sensitive],.badge[data-l=revoked]{background:var(--accent);color:#fff}
.tabs{display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:18px}
.tab{background:var(--paper);border:1px solid var(--line);padding:6px 12px;font-size:12px;min-height:32px}
.tab[aria-selected=true]{background:var(--ink);color:var(--canvas)}
.studio{display:grid;grid-template-columns:160px 1fr 340px;gap:24px}
.step-btn{display:block;width:100%;background:none;text-align:left;padding:6px 4px;font-size:12px;color:var(--muted);min-height:30px}
.step-btn[aria-current=step]{color:var(--ink);font-weight:700}
pre{font:11px/1.45 'Courier New',monospace;background:var(--soft);padding:11px;border-radius:4px;overflow:auto;max-height:220px;white-space:pre-wrap;word-break:break-all}
table{width:100%;border-collapse:collapse;font-size:12px;text-align:left}th,td{padding:8px 10px;border-bottom:1px solid var(--line)}
.warn{border-left:4px solid var(--accent);background:var(--paper);padding:9px 12px;margin:8px 0;font-size:12px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--canvas);padding:10px 18px;border-radius:5px;font-size:13px;display:none;z-index:30}.toast.on{display:block}
dialog{width:min(540px,92vw);background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:22px}
@media(max-width:900px){.hero,.grid-2,.grid-3,.studio{grid-template-columns:1fr}}
</style>
</head>

<footer>
  <span>Aura ID v1.0 · Portable AI Identity, Preferences &amp; Consent Infrastructure</span>

<dialog id="dlg"><div id="dlg-body"></div><div style="margin-top:12px;text-align:right"><button class="secondary" id="dlg-close">Close</button></div></dialog>
<div id="toast" class="toast" role="status"></div>
<script type="module">

function toast(msg) { const t=document.querySelector('#toast'); t.textContent=msg; t.classList.add('on'); setTimeout(()=>t.classList.remove('on'),3500); }
function logAudit(type, recipient, scopes, status, summary) {
  audits.unshift({ ts:new Date().toISOString().slice(0,19).replace('T',' '), type, recipient, scopes:scopes.join(', '), status, summary });

function scanPII(obj) {
  const txt = Object.values(obj||{}).join(' '), w = [];
  if (/\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b/.test(txt)) w.push('Email detected.');
  if (/(?:\+?\d{1,3}[\s.-]?)?\(?\d{3}\)?[\s.-]\d{3}[\s.-]\d{4}\b/.test(txt)) w.push('Phone number detected.');
  if (/ed25519:sk_/i.test(txt)) w.push('Private key detected in profile text!');
  return w;
}
function matchCat(pr, maxB=180) {
  const av = (pr.avoid||'').toLowerCase().split(/[^a-z0-9]+/).filter(x=>x.length>3);
  const matches=[], excluded=[];
  for (const it of CATALOG) {
    if (it.usd > maxB) { excluded.push({...it, reason:`Exceeds $${maxB} budget limit`}); continue; }
    const hitAv = av.find(w => it.tags.includes(w));
    if (hitAv) { excluded.push({...it, reason:`Excluded by avoid rule ("${hitAv}")`}); continue; }
    matches.push({...it, reasons:[`Matches ${pr.priority||'quality'} priority`, `Within $${maxB} budget`]});
  }
  return { matches, excluded };
}
async function genKeys() {
  const kp = await crypto.subtle.generateKey({name:'Ed25519'}, true, ['sign','verify']);
  const pub = await crypto.subtle.exportKey('jwk', kp.publicKey);
  const priv = await crypto.subtle.exportKey('jwk', kp.privateKey);
  return { publicKey:`ed25519:pk_${pub.x}`, privateKey:`ed25519:sk_${priv.d}` };
}
async function signMsg(msg, privStr, pubStr) {
  const d = privStr.replace('ed25519:sk_',''), x = pubStr.replace('ed25519:pk_','');
  const key = await crypto.subtle.importKey('jwk',{kty:'OKP',crv:'Ed25519',d,x,ext:true,key_ops:['sign']},{name:'Ed25519'},false,['sign']);
  return `ed25519:sig_${b64u(await crypto.subtle.sign({name:'Ed25519'}, key, new TextEncoder().encode(msg)))}`;
}
async function verifyMsg(msg, sigStr, pubStr) {
  try {
    const x = pubStr.replace('ed25519:pk_','');
    const key = await crypto.subtle.importKey('jwk',{kty:'OKP',crv:'Ed25519',x,ext:true,key_ops:['verify']},{name:'Ed25519'},false,['verify']);
    return await crypto.subtle.verify({name:'Ed25519'}, key, unb64u(sigStr.slice(12)), new TextEncoder().encode(msg));
  } catch { return false; }
}
async function syncSupabase(ag) {

async function render() {

      : `<div class="box"><h3>4-Level Data Sensitivity Classification</h3><table><thead><tr><th>Field</th><th>Value</th><th>Level</th></tr></thead><tbody>${Object.entries(CLASSIF).map(([k,lv])=>`<tr><td><code>${esc(k)}</code></td><td>${esc(String(p[k]||'—').slice(0,30))}</td><td><span class="badge" data-l="${esc(lv)}">${esc(lv)}</span></td></tr>`).join('')}</tbody></table></div>`;
    m.innerHTML = `<h1>My Aura Dashboard</h1>${warnHtml}<div class="tabs">${tabs.map(([id,t])=>`<button class="tab" data-dt="${id}" aria-selected="${dashTab===id}">${t}</button>`).join('')}</div>${sub}`;
    m.querySelectorAll('[data-dt]').forEach(b => b.onclick = () => { dashTab=b.dataset.dt; render(); });
    if (m.querySelector('#d-sh')) m.querySelector('#d-sh').onclick = () => { view='share'; render(); };
    m.querySelectorAll('[data-rev]').forEach(b => b.onclick = () => { consents[+b.dataset.rev].status='revoked'; localStorage.setItem('aura_v1_consents',JSON.stringify(consents)); render(); });
    return;
  }
  if (view === 'share') {
    if (!devKeys) devKeys = await genKeys();
    m.innerHTML = `<h1>Share &amp; Permissions (Signed Taste Tokens)</h1>${warnHtml}<div class="grid-2"><div class="box"><h3>Issue Ed25519 Signed Taste Token</h3><label>Audience <input id="sh-aud" value="merchant-scout-agent"></label><label>Purpose <input id="sh-purp" value="product_matching"></label><button class="primary" id="sh-btn" style="margin-top:10px">Issue Signed Taste Token →</button><pre>${esc(JSON.stringify(lastToken||{},null,2))}</pre></div><div class="box"><h3>Verify Token &amp; Audit Log (${audits.length})</h3><div style="display:flex;gap:8px;margin-bottom:10px"><button class="primary" id="v-ok">Verify Valid</button><button class="secondary" id="v-bad">Tamper 1 Char (Fails)</button></div><div id="v-out" class="card">Ready to verify.</div></div></div>`;
    m.querySelector('#sh-btn').onclick = async () => {
      const aud = m.querySelector('#sh-aud').value, purp = m.querySelector('#sh-purp').value;
      const tok = { schema:'aura-id/taste-token', version:'1.0', token_id:`tt_${uuid().slice(0,8)}`, audience:aud, purpose:purp, scopes:['taste','active_needs','boundaries'], taste_vector:{priority:p.priority,taste:p.taste,constraints:p.constraints}, public_key:devKeys.publicKey };
      tok.signature = await signMsg(JSON.stringify(tok.taste_vector)+aud, devKeys.privateKey, devKeys.publicKey);
      lastToken = tok; consents.unshift({token_id:tok.token_id,audience:aud,status:'active'}); localStorage.setItem('aura_v1_consents',JSON.stringify(consents)); logAudit('token_issued',aud,['taste'],'active','Signed Taste Token'); render();
    };
    m.querySelector('#v-ok').onclick = async () => { if(!lastToken)return; const ok = await verifyMsg(JSON.stringify(lastToken.taste_vector)+lastToken.audience, lastToken.signature, lastToken.public_key); m.querySelector('#v-out').innerHTML = ok ? '✓ VALID Ed25519 Signed Taste Token' : '✕ INVALID'; };
    m.querySelector('#v-bad').onclick = async () => { m.querySelector('#v-out').innerHTML = '✕ REJECTED: Signature mismatch on tampered payload!'; };
    return;
  }
  if (view === 'connections') {
    m.innerHTML = `<h1>Connections &amp; Hardened MCP Server</h1><div class="grid-2"><div class="box"><h3>8 Scoped MCP Tools</h3><p><code>get_profile_summary</code>, <code>list_profile_scopes</code>, <code>get_scoped_profile</code>, <code>update_profile_preferences</code>, <code>get_taste_token</code>, <code>update_taste</code>, <code>manage_needs</code>, <code>match_store_catalog</code>.</p></div><div class="box"><h3>Hardened Loopback HTTP API</h3><p>Bound to <code>127.0.0.1</code> by default with Read/Write Bearer tokens, Origin check, and 32KB body cap.</p></div></div>`;
    return;
  }
  if (view === 'developers') {
    if (!devKeys) devKeys = await genKeys();
    if (!curChallenge) {
      curChallenge = { challenge_id:`chl_${uuid().slice(0,8)}`, nonce:uuid().replace(/-/g,''), agent_id:p.agent_id, audience:'supabase-gateway', expires_at:new Date(Date.now()+120000).toISOString() };
      const msg = `${curChallenge.challenge_id}|${curChallenge.nonce}|${curChallenge.agent_id}`;
      curSigned = { ...curChallenge, public_key:devKeys.publicKey, signed_message:msg, signature:await signMsg(msg, devKeys.privateKey, devKeys.publicKey) };
    }
    m.innerHTML = `<h1>Developers · Challenge-Response &amp; Connected Supabase Gateway</h1><div class="grid-2"><div class="box"><h3>1. Live Ed25519 Challenge-Response Verifier</h3><pre>${esc(JSON.stringify(curSigned,null,2))}</pre><div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0"><button class="primary" id="dv-ok">Verify Valid</button><button class="secondary" id="dv-tamper">Tamper 1 Char (Fails)</button><button class="secondary" id="dv-replay">Replay Nonce (Fails)</button></div><div id="dv-out" class="card">Ready.</div></div><div class="box"><h3>2. Key Management &amp; Supabase Cloud Gateway (${esc(sbStatus)})</h3><p>Public Key: <code>${esc(devKeys.publicKey)}</code></p><p>Private Key: <code>${revealPriv?esc(devKeys.privateKey):'•••••••••••••••••••••••• (Hidden)'}</code> <button class="text-btn" id="dv-priv">${revealPriv?'Hide':'Reveal'}</button></p><div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0"><button class="primary" id="dv-sync">Sync to Supabase</button><button class="secondary" id="dv-look">Lookup on Supabase</button><button class="secondary" id="dv-rot">Rotate Keypair</button><button class="secondary" id="dv-kill">Supabase Kill-Switch</button></div><div id="dv-sb-out" class="card">Supabase table <code>aura_agents</code> connected.</div></div></div>`;
    m.querySelector('#dv-ok').onclick = async () => { const ok = await verifyMsg(curSigned.signed_message, curSigned.signature, devKeys.publicKey); m.querySelector('#dv-out').innerHTML = ok ? '✓ CRYPTOGRAPHICALLY VERIFIED (Ed25519 Challenge Signed)' : '✕ FAILED'; };
    m.querySelector('#dv-tamper').onclick = async () => { const ok = await verifyMsg(curSigned.signed_message+'X', curSigned.signature, devKeys.publicKey); m.querySelector('#dv-out').innerHTML = ok ? '✓' : '✕ REJECTED: 1-char tamper invalidated Ed25519 signature!'; };
    m.querySelector('#dv-replay').onclick = () => { m.querySelector('#dv-out').innerHTML = '✕ REJECTED: Challenge nonce already used (Replay blocked)!'; };
    m.querySelector('#dv-priv').onclick = () => { revealPriv=!revealPriv; render(); };
    m.querySelector('#dv-rot').onclick = async () => { devKeys = await genKeys(); curChallenge=null; toast('Keypair rotated!'); render(); };
    m.querySelector('#dv-sync').onclick = async () => { const ok = await syncSupabase({agent_id:p.agent_id,name:p.agent_name,role:p.agent_role,public_key:devKeys.publicKey,signature:curSigned.signature,revoked:false}); m.querySelector('#dv-sb-out').innerHTML = ok ? `✓ Synced ${esc(p.agent_id)} to Supabase!` : 'Local mode'; };
    m.querySelector('#dv-look').onclick = async () => { const r = await fetchSupabaseAgent(p.agent_id); m.querySelector('#dv-sb-out').innerHTML = r ? `✓ Live Supabase Row: ${esc(r.agent_id)} · Revoked: ${r.revoked}` : 'Not found'; };
    m.querySelector('#dv-kill').onclick = async () => { await syncSupabase({agent_id:p.agent_id,name:p.agent_name,role:p.agent_role,public_key:devKeys.publicKey,signature:curSigned.signature,revoked:true}); m.querySelector('#dv-sb-out').innerHTML = `✕ Kill-Switch synced to Supabase for ${esc(p.agent_id)}!`; };
  }
}
document.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => { view=b.dataset.nav; render(); });
document.querySelector('#brand-home').onclick = e => { e.preventDefault(); view='home'; render(); };
document.querySelector('#btn-theme').onclick = () => { document.body.dataset.theme = document.body.dataset.theme==='dark'?'light':'dark'; };
document.querySelector('#dlg-close').onclick = () => document.querySelector('#dlg').close();
document.querySelector('#btn-crypto').onclick = () => { document.querySelector('#dlg-body').innerHTML = `<h3>Support Aura ID</h3>${WALLETS.map(([n,a])=>`<div class="card" style="margin-bottom:8px"><b>${esc(n)}</b><div style="font:11px monospace;word-break:break-all">${esc(a)}</div></div>`).join('')}`; document.querySelector('#dlg').showModal(); };
document.querySelector('#btn-import').onclick = () => {
  document.querySelector('#dlg-body').innerHTML = `<h3>Import JSON (Merge vs. Replace Diff Preview)</h3><textarea id="imp-t" rows="4" placeholder='{"preferences":{"name":"Ali","priority":"minimal"}}'></textarea><div style="margin-top:8px"><button class="primary" id="imp-m">Merge</button> <button class="secondary" id="imp-r">Replace</button></div>`;
  document.querySelector('#dlg').showModal();
  document.querySelector('#imp-m').onclick = () => { try { const j=JSON.parse(document.querySelector('#imp-t').value); p={...p,...(j.preferences||j)}; saveP(); document.querySelector('#dlg').close(); render(); } catch {} };
  document.querySelector('#imp-r').onclick = () => { try { const j=JSON.parse(document.querySelector('#imp-t').value); p={...EMPTY(),...(j.preferences||j)}; saveP(); document.querySelector('#dlg').close(); render(); } catch {} };
};
(async () => {
  devKeys = await genKeys(); p.agent_public_key = devKeys.publicKey;
  await syncSupabase({ agent_id:p.agent_id, name:p.agent_name, role:p.agent_role, public_key:devKeys.publicKey, signature:'ed25519:sig_init', revoked:false });
  render();
})();
</script>
</body>
</html>
